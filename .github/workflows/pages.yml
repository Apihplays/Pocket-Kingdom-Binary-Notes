name: Deploy unit database

on:
  push:
    branches: [main]
    paths:
      - "unitdb/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # The app is self-contained; serve it at the site root.
          cp unitdb/PocketKingdom-Units.html _site/index.html
          cp unitdb/*.csv unitdb/*.json _site/
          cp unitdb/README.md _site/README.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
